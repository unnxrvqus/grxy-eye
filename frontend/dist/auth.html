<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>AVXRNUS | Authorization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">

    <script type="module" src="auth/auth.js"></script>
    
</head>

<body>
    <div class="page-background"></div>
    <main class="login">
        <section class="login__card card glow">
            <div class="login__terminal">
                <div class="login__dots">
                    <span class="login__dot login__dot--red"></span>
                    <span class="login__dot login__dot--yellow"></span>
                    <span class="login__dot login__dot--green"></span>
                </div>
                <span class="login__terminal-text">secure_shell@avxrnus</span>
            </div>
            <div class="login__content">
                <h1 class="login__title">
                    AUTHORIZATION<span class="cursor">_</span>
                </h1>
                <p class="login__subtitle">
                    Authenticate to access knowledge base
                </p>
                <form class="login__form">
                    <div class="input-group input-group--username is-visible">
                        <label class="input-group__label">
                            Username
                        </label>
                        <input id="username" class="input-group__field" type="text" placeholder="root">
                    </div>
                    <div class="input-group input-group--email">
                        <label class="input-group__label">
                            Email
                        </label>
                        <input id="email" class="input-group__field" type="email" placeholder="user@example.com">
                    </div>
                    <div class="input-group input-group--password is-visible">
                        <label class="input-group__label">
                            Password
                        </label>
                        <input id="password" class="input-group__field" type="password" placeholder="••••••••">
                    </div>
                    <button class="login__button">
                        ACCESS SYSTEM
                    </button>
                </form>
                <div class="login__links">
                    <a href="#">
                        Forgot password?
                    </a>
                    <a href="#">
                        Create account
                    </a>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
