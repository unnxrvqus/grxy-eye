events {}

http {

    include /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        server_name avxrnus.com www.avxrnus.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    upstream node_backend {
        server node1:3000 max_fails=3 fail_timeout=30s;
        server node2:3000 max_fails=3 fail_timeout=30s;
    }

    server {

        listen 443 ssl http2;

        server_name localhost;

        ssl_certificate     /etc/letsencrypt/live/avxrnus.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/avxrnus.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            root /usr/share/nginx/public;
            index auth.html;
        }

        location /api {

            proxy_pass http://node_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        }
    }
}